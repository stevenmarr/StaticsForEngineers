# StaticsForEngineers: Nginx snippet for the EXISTING performance-video.com site.
#
# This is NOT a server block. Do not put it in sites-available as its own site.
# setup.sh copies it to /etc/nginx/snippets/staticsforengineers.conf; you then add ONE line
#
#     include snippets/staticsforengineers.conf;
#
# inside the existing  server { listen 443 ssl ... server_name performance-video.com ... }
# block (the HTTPS one that certbot already manages), next to the other "location" lines.
# Then:  sudo nginx -t && sudo systemctl reload nginx
#
# The Node app listens on 127.0.0.1:3117 (PORT in .env). If you change PORT, change it below too.

# /StaticsForEngineers  ->  /StaticsForEngineers/
location = /StaticsForEngineers {
    return 301 /StaticsForEngineers/;
}

location ^~ /StaticsForEngineers/ {
    # No URI after the port: the /StaticsForEngineers prefix is passed through unchanged,
    # which is what the app expects (BASE_PATH=/StaticsForEngineers).
    proxy_pass http://127.0.0.1:3117;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_read_timeout 60s;
    client_max_body_size 1m;
}
